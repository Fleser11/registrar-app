<div
    class="course course-item"
    draggable="true"
    [attr.title]="hoverTooltip || coursef(course) || null"
    (mouseenter)="updateTooltip()"
    (dragstart)="onDragStart($event, course)"
    (dragend)="onDragEnd($event)">
    <span class="course-label" appShrinkToFit>{{coursef(course)}}</span>
</div>
