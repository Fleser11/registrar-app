<div class="headers">
    <h1>{{subAudit.name}}</h1>
    <h2>{{subAudit.cardinality}}</h2>
</div>
<p>
    {{subAudit.description}}
</p>
<div class="course-chips">
    <button type="button" class="course-chip" *ngFor="let c of displayCourses"
        [class.course-satisfied]="isCoursePlaced(c)"
        title="Find {{displayLabel(c)}} in the course list" (click)="courseClick.emit(c)">{{displayLabel(c)}}</button>
</div>
